<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Enter your delivery details to continue to checkout.">
  <title>Add Address</title>
  <style>
    :root { --blue:#3d6fa9; --blue-dark:#315d91; --line:#d7d7d7; --muted:#858585; --bg:#f1f1f1; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; color:#222; background:var(--bg); }
    .topbar { position:sticky; top:0; z-index:2; background:#fff; border-bottom:1px solid #ddd; min-height:76px; display:flex; align-items:center; justify-content:center; padding:18px 56px; }
    .topbar h1 { margin:0; font-size:25px; font-weight:700; text-align:center; }
    .close { position:absolute; right:22px; top:50%; transform:translateY(-50%); font-size:30px; color:#222; text-decoration:none; line-height:1; }
    main { width:min(100%,780px); margin:0 auto; padding:20px 16px 28px; }
    .panel { background:#fff; border-radius:22px; padding:28px 26px 32px; }
    .type-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:28px; }
    .type-option { border:2px solid transparent; border-radius:12px; background:#f2f2f2; min-height:72px; padding:14px; display:flex; gap:12px; align-items:center; cursor:pointer; font-size:18px; color:#555; }
    .type-option:has(input:checked) { border-color:var(--blue); }
    .type-option input { accent-color:var(--blue); width:20px; height:20px; }
    .field { margin:0 0 24px; }
    label.field-label { display:block; color:var(--muted); font-size:18px; margin:0 0 7px; }
    input, select { width:100%; border:0; border-bottom:2px solid var(--line); border-radius:0; padding:12px 0 13px; outline:none; font:inherit; font-size:17px; background:transparent; color:#222; }
    input:focus, select:focus { border-bottom-color:var(--blue); }
    input::placeholder { color:#999; opacity:1; }
    .hint { color:#888; font-size:14px; line-height:1.4; margin-top:7px; }
    .select-wrap { position:relative; }
    select { appearance:auto; color:#555; }
    .consent { display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:1.45; color:#666; margin:8px 0 24px; }
    .consent input { width:17px; height:17px; margin-top:1px; flex:0 0 auto; }
    .submit { width:100%; min-height:66px; border:0; border-radius:40px; background:var(--blue); color:#fff; font-size:21px; font-weight:700; cursor:pointer; }
    .submit:hover { background:var(--blue-dark); }
    .submit:disabled { opacity:.65; cursor:wait; }
    .status { display:none; margin:0 0 16px; padding:12px 14px; border-radius:8px; font-size:14px; line-height:1.45; }
    .status.error { display:block; color:#8b1e1e; background:#fff0f0; }
    .status.info { display:block; color:#244c77; background:#edf5ff; }
    .footnote { margin:16px 4px 0; color:#777; font-size:12px; line-height:1.5; text-align:center; }
    @media (min-width:600px) { main { padding-top:28px; } .panel { padding:36px 34px 38px; } .field { margin-bottom:30px; } label.field-label { font-size:20px; } input,select { font-size:18px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Add Address</h1>
    <a class="close" href="#" aria-label="Close" onclick="history.back(); return false;">×</a>
  </header>

  <main>
    <section class="panel">
      <!-- SETUP: replace YOUR_FORMSPREE_ID and YOUR_CHECKOUT_URL below before publishing. -->
      <form id="addressForm" action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
        <input type="hidden" name="_subject" value="New customer shipping details">
        <input type="hidden" name="form_source" value="Shipping address page">

        <div class="type-row" role="group" aria-label="Address type">
          <label class="type-option"><input type="radio" name="address_type" value="Residential" checked> Residential</label>
          <label class="type-option"><input type="radio" name="address_type" value="Business"> Business</label>
        </div>

        <div class="field">
          <label class="field-label" for="name">Recipient Name</label>
          <input id="name" name="recipient_name" autocomplete="name" placeholder="Full name" required>
        </div>

        <div class="field">
          <label class="field-label" for="phone">Recipient Mobile Number</label>
          <input id="phone" name="mobile_number" type="tel" autocomplete="tel" placeholder="Include country code" required>
        </div>

        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
          <div class="hint">Your order confirmation and delivery updates may be sent here.</div>
        </div>

        <div class="field">
          <label class="field-label" for="street">Street Address</label>
          <input id="street" name="street_address" autocomplete="street-address" placeholder="Street name and house number" required>
        </div>

        <div class="field">
          <label class="field-label" for="building">Complex / Building <span style="font-size:.85em">(Optional)</span></label>
          <input id="building" name="building" placeholder="Building, unit number or floor" autocomplete="address-line2">
        </div>

        <div class="field">
          <label class="field-label" for="suburb">Suburb / Neighbourhood</label>
          <input id="suburb" name="suburb" autocomplete="address-level3" placeholder="Suburb or neighbourhood" required>
        </div>

        <div class="field">
          <label class="field-label" for="city">City / Town</label>
          <input id="city" name="city" autocomplete="address-level2" placeholder="City or town" required>
        </div>

        <div class="field">
          <label class="field-label" for="province">Province / State</label>
          <input id="province" name="province_state" autocomplete="address-level1" placeholder="Province or state" required>
        </div>

        <div class="field">
          <label class="field-label" for="postal">Postal Code</label>
          <input id="postal" name="postal_code" autocomplete="postal-code" placeholder="Postal code (if applicable)">
        </div>

        <div class="field">
          <label class="field-label" for="country">Country</label>
          <input id="country" name="country" autocomplete="country-name" placeholder="Country" required>
        </div>

        <label class="consent">
          <input type="checkbox" name="privacy_consent" value="yes" required>
          <span>I agree that the seller may use these details to process my order and arrange delivery. I understand that my information will be handled according to the seller's privacy notice.</span>
        </label>

        <div id="status" class="status" role="status" aria-live="polite"></div>
        <button id="submitButton" class="submit" type="submit">Continue</button>
      </form>
    </section>
    <p class="footnote">Your details are used to process your order and arrange delivery. Do not enter payment card details or passwords on this page.</p>
  </main>

  <script>
    const form = document.getElementById('addressForm');
    const button = document.getElementById('submitButton');
    const statusBox = document.getElementById('status');

    // Replace this with the real checkout URL before publishing.
    const CHECKOUT_URL = 'https://topicpay.site/pay/f2461e67-9ab8-4e04-ab82-b172796dce8b';

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      statusBox.className = 'status';
      statusBox.textContent = '';

      if (form.action.includes('YOUR_FORMSPREE_ID')) {
        statusBox.className = 'status error';
        statusBox.textContent = 'Setup required: add your Formspree form ID before using this form.';
        return;
      }
      if (CHECKOUT_URL.includes('https://topicpay.site/pay/f2461e67-9ab8-4e04-ab82-b172796dce8b')) {
        statusBox.className = 'status error';
        statusBox.textContent = 'Setup required: add your real checkout URL in the code before using this form.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Submitting…';
      statusBox.className = 'status info';
      statusBox.textContent = 'Submitting your details securely…';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          window.location.assign(CHECKOUT_URL);
        } else {
          throw new Error('Submission was not accepted.');
        }
      } catch (error) {
        statusBox.className = 'status error';
        statusBox.textContent = 'We could not submit your details. Please check your connection and try again.';
        button.disabled = false;
        button.textContent = 'Continue';
      }
    });
  </script>
</body>
</html>
